<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creative Morph</title>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">CREATIVE MORPH</p>
      <h1>形变试验台</h1>
      <nav id="scenes" aria-label="作品"></nav>
    </header>
    <section aria-labelledby="title">
      <h2 id="title"></h2>
      <canvas id="stage" width="1280" height="720" aria-label="变形动画"></canvas>
      <div class="transport">
        <button id="play" type="button">播放</button>
        <button id="reverse" type="button">倒放</button>
        <input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="进度">
        <output id="time" for="seek"></output>
        <button id="frame" type="button">保存当前帧</button>
      </div>
      <p id="empty" hidden>作品正在接入。</p>
    </section>
  </main>
  <script type="module" src="/app/main.ts"></script>
</body>
</html>
